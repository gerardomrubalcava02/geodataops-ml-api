name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and tests (no external services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install (locked, Python 3.12 from .python-version)
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest (PostgreSQL integration tests deselected)
        # The 2 tests marked `postgres` need a PostGIS server with the ETL schema.
        # Running them in CI belongs to the next iteration (ETL-API integration).
        run: uv run pytest -q -m "not postgres" -p no:cacheprovider

  container:
    name: Docker build and HTTP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image (trains the model from the synthetic panel)
        run: docker build -t geodataops-ml-api:ci .
      - name: Training summary baked into the image
        run: docker run --rm geodataops-ml-api:ci cat /app/artifacts/models/train_summary.json
      - name: Image runs as non-root
        run: test "$(docker run --rm geodataops-ml-api:ci id -u)" = "10001"
      - name: Start container (default auto mode -> fixtures)
        run: docker run -d --name api-fixtures -p 8000:8000 geodataops-ml-api:ci
      - name: Smoke test (fixtures)
        run: python3 scripts/smoke_http.py --base-url http://127.0.0.1:8000 --expect-source fixtures --wait 90
      - name: Start container with the real ETL CSV mounted
        run: >
          docker run -d --name api-etl -p 8001:8000
          -v "$PWD/tests/data/etl_jalisco_v1.csv:/data/etl/municipios_indicadores.csv:ro"
          geodataops-ml-api:ci
      - name: Smoke test (real ETL sample, expects 422 for prediction)
        run: python3 scripts/smoke_http.py --base-url http://127.0.0.1:8001 --expect-source etl_csv --wait 90
      - name: Docker health status
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' api-fixtures)
            echo "health=$s"; [ "$s" = healthy ] && exit 0; sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: |
          docker logs api-fixtures || true
          docker logs api-etl || true
